name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Parse SemVer tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag and compute version metadata
        id: meta
        run: python3 .github/scripts/release.py metadata --tag "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build Windows executable
    runs-on: windows-latest
    needs: version
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build maactl.exe
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o dist/maactl.exe .
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: maactl-windows-amd64
          path: dist/maactl.exe
          if-no-files-found: error

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate changelog from previous stable release
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/release.py notes --tag "$TAG" --previous "$PREVIOUS_TAG" --repo "$REPO" > CHANGELOG.md
      - name: Show changelog
        run: cat CHANGELOG.md
      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, build, changelog]
    steps:
      - name: Download executable
        uses: actions/download-artifact@v8
        with:
          name: maactl-windows-amd64
          path: dist
      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          title="$TAG"
          if [ "$PRERELEASE" = "true" ] && [ "$CHANNEL" != "prerelease" ]; then
            title="$TAG ($CHANNEL)"
          fi

          flags=(--title "$title" --notes-file CHANGELOG.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease=true)
          else
            flags+=(--prerelease=false)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
            gh release upload "$TAG" dist/maactl.exe --clobber
          else
            gh release create "$TAG" dist/maactl.exe "${flags[@]}"
          fi
