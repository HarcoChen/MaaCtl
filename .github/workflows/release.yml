name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Parse SemVer tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag and compute version metadata
        id: meta
        run: python3 .github/scripts/release.py metadata --tag "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

  # Every platform MaaFramework ships a desktop release for is built on a native
  # runner: the executables are verified by running them, which needs the
  # platform's own libraries. Each job downloads the matching MaaFramework
  # release into maafw/, packs the payload from maafw/bin, and uploads one
  # archive holding both executables.
  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x86_64
            runner: windows-latest
          - platform: win-aarch64
            runner: windows-11-arm
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          # MaaToolkit links against libdbus, and the libc++ the release ships
          # against libatomic; without them the runtime cannot be loaded at all,
          # which `maactl selfcheck` catches below.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-3 libatomic1
      - name: Download the MaaFramework release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/fetch_maafw.py --platform ${{ matrix.platform }}
      - name: Pack the MaaFramework payload
        run: go run ./tools/packmaafw -platform ${{ matrix.platform }}
      - name: Test
        run: |
          go test ./...
          go test -tags bundled ./...
      - name: Build, verify, and pack
        run: python .github/scripts/build_release.py --platform ${{ matrix.platform }} --version "$VERSION"
      - name: Upload the platform archive
        uses: actions/upload-artifact@v7
        with:
          name: maactl-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate changelog from previous stable release
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/release.py notes --tag "$TAG" --previous "$PREVIOUS_TAG" --repo "$REPO" > CHANGELOG.md
      - name: Show changelog
        run: cat CHANGELOG.md
      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, build, changelog]
    steps:
      - name: Download every platform archive
        uses: actions/download-artifact@v8
        with:
          pattern: maactl-*
          path: dist
          merge-multiple: true
      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog
      - name: List the archives to publish
        run: ls -l dist
      - name: Add the artifact table to the notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - >> CHANGELOG.md <<'PY'
          import glob
          import os

          version = os.environ["VERSION"]
          prefix = f"maactl-{version}-"
          lines = ["", "### 下载", "", "| 平台 | 文件 |", "| --- | --- |"]
          for path in sorted(glob.glob("dist/*.zip")):
              name = os.path.basename(path)
              platform = name[len(prefix):-len(".zip")] if name.startswith(prefix) else name
              lines.append(f"| `{platform}` | `{name}` |")
          lines.append("")
          print("\n".join(lines))
          PY
          cat CHANGELOG.md
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          title="$TAG"
          if [ "$PRERELEASE" = "true" ] && [ "$CHANNEL" != "prerelease" ]; then
            title="$TAG ($CHANNEL)"
          fi

          flags=(--title "$title" --notes-file CHANGELOG.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease=true)
          else
            flags+=(--prerelease=false)
          fi

          shopt -s nullglob
          assets=(dist/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no platform archive was built; nothing to publish"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" "${flags[@]}"
          fi

  # The wiring from the npm task to the release is deliberate: the reusable
  # workflow does the publishing, and this job only decides *when* it runs, so
  # a pushed tag also produces the npm package.
  npm:
    name: Publish npm package
    needs: [version, build, release]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
