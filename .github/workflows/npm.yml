name: npm package

on:
  push:
    branches: ["**"]
    paths:
      - "npm/**"
      - ".github/workflows/npm.yml"
  pull_request:
    paths:
      - "npm/**"
      - ".github/workflows/npm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test wrapper (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        working-directory: npm
        run: npm test
      - name: Set up Go
        if: matrix.node == '22'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build maactl for the smoke test
        if: matrix.node == '22'
        shell: pwsh
        run: go build -o maactl.exe ./cmd/maactl
      - name: Package, then run maactl through npx
        if: matrix.node == '22'
        working-directory: npm
        env:
          # The lite build loads MaaFramework from ./maafw/bin, which this job
          # never downloads; --version and --help do not need the DLLs.
          MAACTL_SKIP_DOWNLOAD: "1"
        run: |
          npm pack --dry-run
          node scripts/vendor-binary.js
          npx --yes --package . maactl -v
          npx --yes --package . maactl --help
